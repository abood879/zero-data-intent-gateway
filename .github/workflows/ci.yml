name: Enterprise CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-linux:
    name: Test Suite (Linux + Redis Service)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx uvicorn redis

      - name: Run Test Suite with Coverage
        shell: bash
        env:
          PYTHONPATH: .
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key
          GATEWAY_API_TOKEN: test-token
          TOKEN_IDENTITY_MAP: '{"test-token":{"role":"finance_agent","user_id":"red-team-agent"}}'
        run: |
          pytest --cov=app --cov-report=term-missing tests/

  test-windows:
    name: Test Suite (Windows msvcrt Parity)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx uvicorn redis

      - name: Run Test Suite (Windows Concurrency & Fail-Closed Validation)
        env:
          PYTHONPATH: .
          SECRET_KEY: test-secret-key
          GATEWAY_API_TOKEN: test-token
          TOKEN_IDENTITY_MAP: '{"test-token":{"role":"finance_agent","user_id":"red-team-agent"}}'
        run: |
          python -m pytest -v tests/

  red-team-simulation:
    name: Red-Team Simulation
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx uvicorn redis

      - name: Start Mock Provider
        shell: bash
        env:
          PYTHONPATH: .
          REDIS_URL: "redis://localhost:6379/0"
        run: |
          nohup python -m uvicorn mock_provider:app --host 127.0.0.1 --port 8090 > /tmp/provider.log 2>&1 &
          sleep 2

      - name: Start Gateway Server
        shell: bash
        env:
          PYTHONPATH: .
          REDIS_URL: "redis://localhost:6379/0"
          MOCK_PROVIDER_URL: "http://127.0.0.1:8090"
          GATEWAY_API_TOKEN: "test-token"
          TOKEN_IDENTITY_MAP: '{"test-token":{"role":"finance_agent","user_id":"red-team-agent"}}'
          GATEWAY_BUDGET_DB_PATH: "/tmp/red-team-budgets.sqlite3"
          AUDIT_LEDGER_PATH: "/tmp/red-team-audit.jsonl"
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/gateway.log 2>&1 &
          sleep 3

      - name: Run Red-Team Simulation Tests
        shell: bash
        env:
          PYTHONPATH: .
          GATEWAY_URL: "http://127.0.0.1:8000"
          MOCK_PROVIDER_URL: "http://127.0.0.1:8090"
          GATEWAY_API_TOKEN: "test-token"
          TOKEN_IDENTITY_MAP: '{"test-token":{"role":"finance_agent","user_id":"red-team-agent"}}'
          GATEWAY_BUDGET_DB_PATH: "/tmp/red-team-budgets.sqlite3"
          REDIS_URL: "redis://localhost:6379/0"
          NO_PROXY: "localhost,127.0.0.1"
        run: |
          python -m pytest -v -s tests/red_team_simulation.py
