name: Enterprise CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov httpx uvicorn redis

      - name: Run Standard Suite
        env:
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key
          GATEWAY_API_TOKEN: test-token
          TOKEN_IDENTITY_MAP: '{"test-token":{"role":"finance_agent","user_id":"red-team-agent"}}'
        run: |
          pytest --cov=app --cov-report=term-missing tests/

  red-team-simulation:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest httpx uvicorn redis

      - name: Run Red-Team Simulation Test Pipeline
        env:
          REDIS_URL: "redis://localhost:6379/0"
          MOCK_PROVIDER_URL: "http://127.0.0.1:8090"
          GATEWAY_URL: "http://127.0.0.1:8000"
          GATEWAY_API_TOKEN: "test-token"
          TOKEN_IDENTITY_MAP: '{"test-token":{"role":"finance_agent","user_id":"red-team-agent"}}'
          GATEWAY_BUDGET_DB_PATH: "/tmp/red-team-budgets.sqlite3"
          AUDIT_LEDGER_PATH: "/tmp/red-team-audit.jsonl"
          NO_PROXY: "localhost,127.0.0.1"
        run: |
          python -m uvicorn mock_provider:app --host 127.0.0.1 --port 8090 &
          PID_PROVIDER=$!
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          PID_GATEWAY=$!
          
          echo "Waiting for Gateway and Provider services..."
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:8090/health > /dev/null && curl -s http://127.0.0.1:8000/health > /dev/null; then
              echo "Services successfully started!"
              break
            fi
            sleep 1
          done

          python -m pytest -v -s tests/red_team_simulation.py
          TEST_EXIT_CODE=$?

          kill $PID_PROVIDER $PID_GATEWAY || true
          exit $TEST_EXIT_CODE
