version: '3.8'

services:
  # 1. البوابة الحتمية
  gateway:
    build: .
    container_name: zero-data-gateway
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      REDIS_URL: redis://redis:6379/0
      OPA_URL: http://opa:8181
      TOKEN_IDENTITY_MAP: ${TOKEN_IDENTITY_MAP:?Set TOKEN_IDENTITY_MAP before starting}
      GATEWAY_CONTEXT_HMAC_SECRET: ${GATEWAY_CONTEXT_HMAC_SECRET:?Set GATEWAY_CONTEXT_HMAC_SECRET before starting}
      AUDIT_LEDGER_PATH: /var/lib/zero-data-gateway/audit_ledger.jsonl
      STEP_UP_NONCE_DB_PATH: /var/lib/zero-data-gateway/step_up_nonces.sqlite3
    depends_on:
      - redis
      - opa
    restart: unless-stopped
    volumes:
      - gateway-state:/var/lib/zero-data-gateway
    networks:
      - gateway-edge
      - control-plane

  # 2. السجل التشفيري الذري الموزع
  redis:
    image: redis:7-alpine
    container_name: zero-data-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - always
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - control-plane

  # 3. محرك السياسات المؤسسي المستقل (OPA Sidecar)
  opa:
    image: openpolicyagent/opa:latest
    container_name: zero-data-opa
    volumes:
      - ./config:/policies
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "/policies/policy.rego"
    restart: unless-stopped
    networks:
      - control-plane

networks:
  gateway-edge:
  control-plane:
    internal: true

volumes:
  gateway-state:
  redis-data:
