services:
  intent-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    ports:
      - "8000:8000"
    networks:
      - internal-only-net
      - external-net

  ai-agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    environment:
      GATEWAY_URL: http://intent-gateway:8000
      HTTP_PROXY: http://intent-gateway:8000
      HTTPS_PROXY: http://intent-gateway:8000
    depends_on:
      - intent-gateway
    networks:
      - internal-only-net

  mock-provider:
    build:
      context: .
      dockerfile: Dockerfile.mock
    ports:
      - "8090:8090"
    networks:
      - external-net

networks:
  internal-only-net:
    internal: true
  external-net:
