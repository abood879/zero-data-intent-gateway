services:
  postgres:
    image: postgres:16-alpine
    container_name: zero-data-postgres
    environment:
      POSTGRES_DB: gateway_governance
      POSTGRES_USER: gateway_admin
      POSTGRES_PASSWORD: gateway_secure_password
    ports:
      - "5432:5432"
    volumes:
      - ./migrations/001_initial_postgres_schema.sql:/docker-entrypoint-initdb.d/001_initial_postgres_schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway_admin -d gateway_governance"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: zero-data-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
